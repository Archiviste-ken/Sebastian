[project]
name = "sebastian"
version = "0.1.0"
description = "Sebastian AI Execution Layer"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "fastapi>=0.100",
    "sqlalchemy>=2.0",
    "groq>=0.30",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
markers = [
    "real_groq: tests that call the real Groq API",
]